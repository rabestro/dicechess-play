name: 'Ops: Deploy (Cloudflare Pages)'

# Builds in GitHub Actions (where @rabestro/dicechess-engine installs via GITHUB_TOKEN) and uploads
# the static dist/ to a Cloudflare Pages "Direct Upload" project. The browser never needs the engine
# token; Cloudflare never needs a packages PAT.
#
# Two destinations, one build path:
#   push to main / manual dispatch -> the production branch, i.e. play.jc.id.lv
#   pull request                   -> a per-branch PREVIEW deployment on *.pages.dev, commented
#                                     on the PR, so the real production bundle is reviewable
#                                     before it is merged (#187)
#
# Requires two repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID — your Cloudflare account id
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read # GITHUB_TOKEN needs this to install @rabestro/dicechess-engine
  pull-requests: write # to comment the preview URL on the PR

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    # Fork PRs cannot see the Cloudflare secrets, so a preview would fail on them for a reason the
    # contributor cannot fix. Skip rather than fail — CI still covers the change.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build
        env:
          # Public URL of the play-api (live HvH + finished-game recording via POST
          # /ingest/games). Baked in here because the bundle is built in Actions and
          # Direct-Uploaded — a Cloudflare Pages *dashboard* variable would never reach
          # vite build. Override via a repo VARIABLE (vars.VITE_PLAY_API_URL); empty =
          # /live disabled AND recording disabled (games stay in IndexedDB).
          #
          # Previews point at the SAME play-api as production: /play is fully exercisable either
          # way, and pointing previews at the real API is what makes the lobby and live surfaces
          # reviewable at all. The cost is that a preview writes real games and real ingest rows —
          # set vars.VITE_PLAY_API_URL empty-string-per-environment if that ever becomes unwanted.
          # Note that /live from a preview also needs the *.pages.dev origin allowed by play-api's
          # PLAY_CORS_ORIGINS, which is otherwise pinned to the production origin.
          VITE_PLAY_API_URL: ${{ vars.VITE_PLAY_API_URL || 'https://play-api.jc.id.lv' }}

      # wrangler pages deploy does not auto-create the project; create it once
      # (no-op / harmless error if it already exists, hence `|| true`).
      - name: Ensure Pages project exists
        run: npx --yes wrangler pages project create dicechess-play --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Cloudflare decides production vs preview purely from --branch: the project's production
      # branch (main) deploys to the live site, anything else becomes a preview deployment.
      - name: Resolve deploy branch
        id: target
        run: echo "branch=${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=dicechess-play --branch=${{ steps.target.outputs.branch }}

      - name: Comment the preview URL
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The alias URL is per-BRANCH and therefore stable across pushes, so the comment's link
          # keeps working as the PR moves; `deployment-url` is per-deployment and goes stale.
          # Fall back to it anyway — an aliasless deploy should still leave a usable link.
          PREVIEW_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none --body \
            "🔍 **Preview**: ${PREVIEW_URL}

          The production bundle for \`${{ steps.target.outputs.branch }}\`, built exactly as it would deploy. Updated on every push to this PR."
